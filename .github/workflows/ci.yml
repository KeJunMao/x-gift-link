name: Check and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: x-gift-link
          path: dist/*.zip
          if-no-files-found: error
